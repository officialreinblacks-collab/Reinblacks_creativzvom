<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Clips - Reinblacks Creativz</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
<style>
    :root { --red:#E50914; }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { height:100%; background:#000; overflow:hidden; font-family:'DM Sans', sans-serif; }

    /* ─── top bar ─── */
    #clips-topbar { position:fixed; top:0; left:0; right:0; z-index:20; display:flex; align-items:center; gap:12px; padding:14px 16px; background:linear-gradient(to bottom, rgba(0,0,0,0.6), transparent); pointer-events:none; }
    #clips-topbar a { pointer-events:all; color:#fff; text-decoration:none; width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,0.12); display:flex; align-items:center; justify-content:center; }
    #clips-topbar h1 { font-family:'Bebas Neue',sans-serif; font-size:1.3rem; letter-spacing:0.05em; color:#fff; }
    #clips-topbar h1 i { color:var(--red); margin-right:6px; }

    /* ─── feed ─── */
    #clips-feed-scroll { height:100%; width:100%; overflow-y:scroll; scroll-snap-type:y mandatory; scrollbar-width:none; -ms-overflow-style:none; }
    #clips-feed-scroll::-webkit-scrollbar { display:none; }
    .clip-page { position:relative; height:100%; width:100%; scroll-snap-align:start; scroll-snap-stop:always; background:#000; overflow:hidden; }
    .clip-media { position:absolute; inset:0; background:#000 center/cover no-repeat; }
    .clip-media iframe, .clip-media video { width:100%; height:100%; object-fit:cover; border:none; display:block; pointer-events:none; }
    .clip-spinner { position:absolute; top:50%; left:50%; width:34px; height:34px; margin:-17px 0 0 -17px; border:3px solid rgba(255,255,255,0.25); border-top-color:#fff; border-radius:50%; animation:clipSpin 0.8s linear infinite; z-index:3; opacity:0; transition:opacity 0.2s; pointer-events:none; }
    .clip-spinner.show { opacity:1; }
    @keyframes clipSpin { to { transform:rotate(360deg); } }
    .clip-gradient { position:absolute; left:0; right:0; bottom:0; height:55%; background:linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.55) 35%, transparent 80%); pointer-events:none; }

    .clip-side-actions { position:absolute; right:12px; bottom:110px; z-index:6; display:flex; flex-direction:column; align-items:center; gap:20px; }
    .clip-icon-btn { background:rgba(120,120,120,0.45); backdrop-filter:blur(6px); border:none; color:#fff; width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.05rem; cursor:pointer; transition:background 0.25s, transform 0.15s; }
    .clip-icon-btn:active { transform:scale(0.9); }
    .clip-icon-btn.active-check { background:var(--red); }
    .clip-avatar { width:42px; height:42px; border-radius:50%; overflow:hidden; border:2px solid rgba(255,255,255,0.85); background:#111; }
    .clip-avatar img { width:100%; height:100%; object-fit:cover; display:block; }

    .clip-info { position:absolute; left:16px; right:88px; bottom:56px; z-index:6; color:#fff; }
    .clip-info-title { font-family:'Bebas Neue',sans-serif; font-size:1.5rem; letter-spacing:0.02em; margin-bottom:6px; text-shadow:0 1px 4px rgba(0,0,0,0.6); }
    .clip-info-meta { font-size:0.78rem; font-weight:600; color:#eee; margin-bottom:6px; text-shadow:0 1px 4px rgba(0,0,0,0.6); }
    .clip-info-desc { font-size:0.82rem; color:#eee; line-height:1.4; margin-bottom:12px; text-shadow:0 1px 4px rgba(0,0,0,0.6); }
    .clip-info-desc .clip-desc-text.collapsed { display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }
    .clip-more-btn { background:none; border:none; color:#ccc; font-weight:700; font-size:0.82rem; cursor:pointer; padding:0; margin-left:4px; }
    .clip-progress-row { display:flex; align-items:center; gap:8px; }
    .clip-progress-track { flex:1; height:3px; background:rgba(255,255,255,0.3); border-radius:2px; overflow:hidden; }
    .clip-progress-fill { height:100%; width:0%; background:#fff; border-radius:2px; }
    .clip-progress-time { font-size:0.68rem; color:#ddd; white-space:nowrap; min-width:32px; text-align:right; }

    #clips-toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%) translateY(20px); background:rgba(20,20,20,0.95); color:#fff; font-size:0.85rem; font-weight:600; padding:10px 18px; border-radius:24px; z-index:50; opacity:0; pointer-events:none; transition:opacity 0.25s, transform 0.25s; }
    #clips-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    #clips-loading-note { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color:#666; font-size:0.9rem; z-index:1; }
</style>
</head>
<body>

    <div id="clips-topbar">
        <a href="index.html" aria-label="Back"><i class="fas fa-chevron-left"></i></a>
        <h1><i class="fas fa-clapperboard"></i>Clips</h1>
    </div>

    <div id="clips-loading-note">Loading clips…</div>
    <div id="clips-feed-scroll"></div>
    <div id="clips-toast"></div>

<script>
(function() {
    const CLIP_SECONDS = 30;
    const clipsData = [{"video": "https://res.cloudinary.com/dmnwlnpr5/video/upload/f_auto/q_auto/v1785614665/lv_0_20260801143114_3_nz0t1a.mp4", "title": "Squid Game", "meta": "2026 · Face Swap · HD", "desc": "An AI face-swap creation reimagining an iconic scene with a fully transformed cast."}, {"video": "hEBhOCy4Dcg", "title": "Squid Game Extra", "meta": "2026 · Face Swap · HD", "desc": "An AI face-swap creation reimagining an iconic scene with a fully transformed cast."}, {"video": "asaUW8weEkM", "title": "Devil's Call", "meta": "2026 · Horror Series · HD", "desc": "A fateful pact made under the cover of night pulls an unsuspecting soul into a spiral of dread — where every voice on the other end of the line demands a price."}, {"video": "n2oL64ZiYNo", "title": "Abroad Karma", "meta": "2026 · Drama · HD", "desc": "A story of ambition and consequence, following a journey abroad where the past has a way of catching up."}, {"video": "KbCWyQJ5hcI", "title": "Crimson Verdict", "meta": "2026 · Drama · HD", "desc": ""}, {"video": "M5UgIpnYTu8", "title": "Silent Reckoning", "meta": "2026 · Drama · HD", "desc": ""}, {"video": "6TNqWuYg1vM", "title": "Another Tomb Life", "meta": "2026 · Horror Series · HD", "desc": "A haunting mini film exploring what's left behind when the line between the living and the dead begins to blur."}, {"video": "sIcTXVVZh_o", "title": "Sweet Monster", "meta": "2026 · Crime Drama · HD", "desc": "A diamond-smuggling operation draws two worlds together — and a secret affair threatens to unravel everything before the deal is done."}, {"video": "0FkJsIyF0lQ", "title": "Stolen Glances", "meta": "2026 · Romance · HD", "desc": ""}, {"video": "ClxdEC_5PVI", "title": "Whispers at Dusk", "meta": "2026 · Romance · HD", "desc": ""}, {"video": "h4IGltPCCOY", "title": "Midnight Pulse", "meta": "2026 · Shorts · HD", "desc": ""}, {"video": "dKJnoXHBJpU", "title": "Echoes of Tomorrow", "meta": "2026 · Shorts · HD", "desc": ""}, {"video": "dDBLY06N_Yk", "title": "Neon Drift", "meta": "2026 · Shorts · HD", "desc": ""}, {"video": "PjYgx0UBqwk", "title": "Silent Reverie", "meta": "2026 · Shorts · HD", "desc": ""}, {"video": "70yGeT0C51g", "title": "Crimson Horizon", "meta": "2026 · Shorts · HD", "desc": ""}, {"video": "0ob_zlZcZMA", "title": "Fading Signal", "meta": "2026 · Shorts · HD", "desc": ""}, {"video": "LU9-wmg6noM", "title": "Velvet Static", "meta": "2026 · Shorts · HD", "desc": ""}, {"video": "_qLAmXTtsVc", "title": "Wildfire Echo", "meta": "2026 · Shorts · HD", "desc": ""}, {"video": "VdE0lo12RE4", "title": "Golden Static", "meta": "2026 · Shorts · HD", "desc": ""}, {"video": "7sB2ih10a9c", "title": "Shadow Current", "meta": "2026 · Shorts · HD", "desc": ""}, {"video": "b95baQMRC_U", "title": "Fractured Dawn", "meta": "2026 · Shorts · HD", "desc": ""}, {"video": "wGvsDOvaDS0", "title": "Static Bloom", "meta": "2026 · Shorts · HD", "desc": ""}, {"video": "y4e5-7XyQFk", "title": "African Beauty", "meta": "2026 · Shorts · HD", "desc": ""}, {"video": "iIeq-ZlzLZA", "title": "Pulse Frequency", "meta": "2026 · Music Visualizer · HD", "desc": ""}, {"video": "YpjmFiI_6Ms", "title": "Chromatic Waves", "meta": "2026 · Music Visualizer · HD", "desc": ""}, {"video": "cJjmowtYDYU", "title": "Sonic Bloom", "meta": "2026 · Music Visualizer · HD", "desc": ""}, {"video": "0lMemK0xYXs", "title": "Rhythm Drift", "meta": "2026 · Music Visualizer · HD", "desc": ""}, {"video": "L4TyqKQEVV4", "title": "Unfiltered Conversations", "meta": "2026 · Podcast · HD", "desc": ""}, {"video": "UqldkDVh_l8", "title": "Behind the Mic", "meta": "2026 · Podcast · HD", "desc": ""}, {"video": "jqoaUb4QxzU", "title": "Real Talk Sessions", "meta": "2026 · Podcast · HD", "desc": ""}, {"video": "2ZhlAr4vQcc", "title": "New Drop Alert", "meta": "2026 · Ad & Announcement · HD", "desc": ""}, {"video": "TnKSGkY5Hds", "title": "Behind The Curtain", "meta": "2026 · Ad & Announcement · HD", "desc": ""}, {"video": "UhYXE_puhrc", "title": "Big Reveal", "meta": "2026 · Ad & Announcement · HD", "desc": ""}, {"video": "mDtt6GHYlFg", "title": "Studio Update", "meta": "2026 · Ad & Announcement · HD", "desc": ""}, {"video": "0fYn1A5CxGQ", "title": "Fresh Release", "meta": "2026 · Ad & Announcement · HD", "desc": ""}, {"video": "zIUotjon9PI", "title": "Exclusive Preview", "meta": "2026 · Ad & Announcement · HD", "desc": ""}, {"video": "s6cpSzRMfw8", "title": "Season Teaser", "meta": "2026 · Ad & Announcement · HD", "desc": ""}, {"video": "XxHxFwlWGD8", "title": "Special Bulletin", "meta": "2026 · Ad & Announcement · HD", "desc": ""}, {"video": "4dIgvmRo9v8", "title": "Next Chapter", "meta": "2026 · Ad & Announcement · HD", "desc": ""}, {"video": "R7bnadJ2CJc", "title": "Coming Soon", "meta": "2026 · Ad & Announcement · HD", "desc": ""}, {"video": "98S3D7pZhLQ", "title": "Depth Illusion", "meta": "2026 · 3D · HD", "desc": ""}, {"video": "vW8MHnaJKD4", "title": "Parallax Dream", "meta": "2026 · 3D · HD", "desc": ""}, {"video": "RFL3CxBv7u4", "title": "Hyperreal Motion", "meta": "2026 · 3D · HD", "desc": ""}, {"video": "vP5xPa0RvUs", "title": "Floating Frame", "meta": "2026 · 3D · HD", "desc": ""}, {"video": "nw_1wiWYGuc", "title": "Prism Shift", "meta": "2026 · 3D · HD", "desc": ""}, {"video": "jsbHPM61SIs", "title": "Volumetric Flow", "meta": "2026 · 3D · HD", "desc": ""}, {"video": "whXIeYsJ-sE", "title": "Layered Reality", "meta": "2026 · 3D · HD", "desc": ""}, {"video": "Wv7KUgotoJo", "title": "Spatial Drift", "meta": "2026 · 3D · HD", "desc": ""}, {"video": "B4ZDXxOt2WE", "title": "Immersive Pulse", "meta": "2026 · 3D · HD", "desc": ""}, {"video": "IVRjEX1moL0", "title": "Depth Chamber", "meta": "2026 · 3D · HD", "desc": ""}, {"video": "IsBX2fcz4_Q", "title": "Dimensional Echo", "meta": "2026 · 3D · HD", "desc": ""}, {"video": "k_IaZ1gvT_g", "title": "Optic Wave", "meta": "2026 · 3D · HD", "desc": ""}, {"video": "nUIZDEAHHR4", "title": "Stereo Vision", "meta": "2026 · 3D · HD", "desc": ""}, {"video": "4g9YKK4nFno", "title": "Render Horizon", "meta": "2026 · 3D · HD", "desc": ""}];

    const feedScroll = document.getElementById('clips-feed-scroll');
    const loadingNote = document.getElementById('clips-loading-note');
    const toastEl = document.getElementById('clips-toast');
    let clipsMuted = true;
    let activeClipPage = null;

    function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => toastEl.classList.remove('show'), 1600);
    }
    function getMyList() { try { return JSON.parse(localStorage.getItem('rc_mylist') || '[]'); } catch(e) { return []; } }
    function fmtClipTime(sec) { sec = Math.max(0, Math.floor(sec)); const m = Math.floor(sec / 60); const s = sec % 60; return `${m}:${String(s).padStart(2,'0')}`; }

    function buildFeed() {
        if (!clipsData.length) { loadingNote.textContent = 'No clips found.'; return; }
        loadingNote.remove();
        feedScroll.innerHTML = clipsData.map((clip, idx) => {
            const isDirectSrc = /^https?:\/\//i.test(clip.video);
            const thumb = isDirectSrc ? '' : `https://img.youtube.com/vi/${clip.video}/hqdefault.jpg`;
            const inList = getMyList().includes(clip.video);
            return `<div class="clip-page" data-idx="${idx}" data-video="${clip.video.replace(/"/g,'&quot;')}">
                <div class="clip-media"${thumb ? ` style="background-image:url('${thumb}')"` : ''}></div>
                <div class="clip-spinner"></div>
                <div class="clip-gradient"></div>
                <div class="clip-side-actions">
                    <button class="clip-icon-btn clip-mute-btn"><i class="fas fa-volume-mute"></i></button>
                    <button class="clip-icon-btn clip-list-btn${inList ? ' active-check' : ''}"><i class="fas fa-${inList ? 'check' : 'plus'}"></i></button>
                    <button class="clip-icon-btn clip-share-btn"><i class="fas fa-share-nodes"></i></button>
                    <div class="clip-avatar">${thumb ? `<img src="${thumb}" alt="" loading="lazy">` : ''}</div>
                </div>
                <div class="clip-info">
                    <div class="clip-info-title">${clip.title}</div>
                    ${clip.meta ? `<div class="clip-info-meta">${clip.meta}</div>` : ''}
                    ${clip.desc ? `<div class="clip-info-desc"><span class="clip-desc-text collapsed">${clip.desc}</span> <button class="clip-more-btn">more</button></div>` : ''}
                    <div class="clip-progress-row">
                        <span class="clip-progress-time clip-elapsed">0:00</span>
                        <div class="clip-progress-track"><div class="clip-progress-fill"></div></div>
                        <span class="clip-progress-time clip-duration">0:${CLIP_SECONDS}</span>
                    </div>
                </div>
            </div>`;
        }).join('');

        feedScroll.querySelectorAll('.clip-mute-btn').forEach(btn => btn.addEventListener('click', function(e) {
            e.stopPropagation();
            clipsMuted = !clipsMuted;
            applyClipMute(btn.closest('.clip-page'));
        }));
        feedScroll.querySelectorAll('.clip-list-btn').forEach(btn => btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const page = btn.closest('.clip-page');
            const vid = page.getAttribute('data-video');
            let list = getMyList();
            const inList = list.includes(vid);
            list = inList ? list.filter(id => id !== vid) : [...list, vid];
            localStorage.setItem('rc_mylist', JSON.stringify(list));
            btn.classList.toggle('active-check', !inList);
            btn.innerHTML = !inList ? '<i class="fas fa-check"></i>' : '<i class="fas fa-plus"></i>';
            showToast(!inList ? 'Added to My List' : 'Removed from My List');
        }));
        feedScroll.querySelectorAll('.clip-share-btn').forEach(btn => btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const page = btn.closest('.clip-page');
            const vid = page.getAttribute('data-video');
            const url = /^https?:\/\//i.test(vid) ? vid : `https://www.youtube.com/watch?v=${vid}`;
            if (navigator.share) { navigator.share({ title: 'Reinblacks Creativz', url }).catch(()=>{}); }
            else if (navigator.clipboard) { navigator.clipboard.writeText(url).then(() => showToast('Link copied')); }
        }));
        feedScroll.querySelectorAll('.clip-more-btn').forEach(btn => btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const textEl = btn.previousElementSibling;
            const collapsed = textEl.classList.toggle('collapsed');
            btn.textContent = collapsed ? 'more' : 'less';
        }));

        // Debounced scroll → only activate the settled page, never mid-scroll.
        // This avoids the "many clips fired at once" freeze from fast swiping.
        let scrollDebounce;
        feedScroll.addEventListener('scroll', () => {
            clearTimeout(scrollDebounce);
            scrollDebounce = setTimeout(settleOnCurrentPage, 130);
        }, { passive: true });

        settleOnCurrentPage();
    }

    function settleOnCurrentPage() {
        const idx = Math.round(feedScroll.scrollTop / feedScroll.clientHeight);
        const page = feedScroll.querySelector(`.clip-page[data-idx="${idx}"]`);
        if (page) setActiveClipPage(page);
    }

    function setActiveClipPage(page) {
        if (page === activeClipPage) return;
        const prev = activeClipPage;
        activeClipPage = page;
        if (prev) deactivateClipPage(prev);
        activateClipPage(page);
    }

    function updateMuteIcon(page) {
        const btn = page.querySelector('.clip-mute-btn');
        if (btn) btn.innerHTML = clipsMuted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
    }
    function ytCommand(iframe, func, args) {
        try { iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func, args: args || [] }), '*'); } catch(e) {}
    }
    function applyClipMute(page) {
        updateMuteIcon(page);
        const mediaWrap = page.querySelector('.clip-media');
        const v = mediaWrap.querySelector('video');
        const iframe = mediaWrap.querySelector('iframe');
        if (v) v.muted = clipsMuted;
        else if (iframe) ytCommand(iframe, clipsMuted ? 'mute' : 'unMute');
    }

    // Builds the video/iframe element. autoplay:true = visible+audible active clip.
    // autoplay:false = silent background preload (no bandwidth-heavy playback).
    function buildClipMedia(page, autoplay) {
        const mediaWrap = page.querySelector('.clip-media');
        const spinner = page.querySelector('.clip-spinner');
        const vid = page.getAttribute('data-video');
        const isDirectSrc = /^https?:\/\//i.test(vid);
        clearClipTimer(page);
        mediaWrap.querySelectorAll('video,iframe').forEach(el => el.remove());
        if (isDirectSrc) {
            const videoEl = document.createElement('video');
            videoEl.muted = autoplay ? clipsMuted : true;
            videoEl.playsInline = true;
            videoEl.setAttribute('playsinline', '');
            videoEl.preload = autoplay ? 'auto' : 'metadata';
            videoEl.loop = false;
            mediaWrap.appendChild(videoEl);
            videoEl.addEventListener('playing', () => { if (spinner) spinner.classList.remove('show'); });
            videoEl.addEventListener('waiting', () => { if (spinner && mediaWrap.dataset.loaded === '1') spinner.classList.add('show'); });
            videoEl.addEventListener('timeupdate', function() {
                const dur = Math.min(CLIP_SECONDS, videoEl.duration || CLIP_SECONDS);
                if (videoEl.currentTime >= dur) { videoEl.currentTime = 0; if (!videoEl.paused) videoEl.play().catch(()=>{}); }
                if (mediaWrap.dataset.loaded === '1') updateClipProgress(page, videoEl.currentTime, dur);
            });
            videoEl.src = vid;
            if (autoplay) { if (spinner) spinner.classList.add('show'); videoEl.play().catch(()=>{}); }
        } else {
            const iframe = document.createElement('iframe');
            iframe.allow = 'autoplay; encrypted-media';
            iframe.setAttribute('allowfullscreen', '');
            if (autoplay) { if (spinner) spinner.classList.add('show'); iframe.addEventListener('load', () => { if (spinner) spinner.classList.remove('show'); }); }
            mediaWrap.appendChild(iframe);
            const autoplayParam = autoplay ? 1 : 0;
            const muteParam = autoplay ? (clipsMuted ? 1 : 0) : 1;
            iframe.src = `https://www.youtube.com/embed/${vid}?autoplay=${autoplayParam}&mute=${muteParam}&controls=0&modestbranding=1&rel=0&playsinline=1&enablejsapi=1&start=0&end=${CLIP_SECONDS}&loop=1&playlist=${vid}`;
            if (autoplay) startClipSimTimer(page);
        }
        mediaWrap.dataset.loaded = autoplay ? '1' : 'preload';
    }

    function preloadClipPage(page) {
        if (!page) return;
        const mediaWrap = page.querySelector('.clip-media');
        if ((mediaWrap.dataset.loaded || '0') !== '0') return;
        buildClipMedia(page, false);
    }
    function preloadNextClip(page) {
        const idx = parseInt(page.getAttribute('data-idx'), 10);
        const nextPage = feedScroll.querySelector(`.clip-page[data-idx="${idx + 1}"]`);
        if (!nextPage) return;
        clearTimeout(nextPage._preloadTimer);
        nextPage._preloadTimer = setTimeout(() => preloadClipPage(nextPage), 700);
    }

    function promoteClipPage(page) {
        const mediaWrap = page.querySelector('.clip-media');
        const spinner = page.querySelector('.clip-spinner');
        const v = mediaWrap.querySelector('video');
        const iframe = mediaWrap.querySelector('iframe');
        if (v) { v.muted = clipsMuted; v.play().catch(()=>{}); if (spinner) spinner.classList.remove('show'); }
        else if (iframe) { ytCommand(iframe, clipsMuted ? 'mute' : 'unMute'); ytCommand(iframe, 'playVideo'); startClipSimTimer(page); if (spinner) spinner.classList.remove('show'); }
        else { buildClipMedia(page, true); return; }
        mediaWrap.dataset.loaded = '1';
    }

    function activateClipPage(page) {
        const mediaWrap = page.querySelector('.clip-media');
        const state = mediaWrap.dataset.loaded || '0';
        if (state === '1') {
            const v = mediaWrap.querySelector('video');
            if (v && v.paused) v.play().catch(()=>{});
        } else if (state === 'preload') {
            promoteClipPage(page);
        } else {
            buildClipMedia(page, true);
        }
        updateMuteIcon(page);
        preloadNextClip(page);
    }

    function deactivateClipPage(page) {
        const mediaWrap = page.querySelector('.clip-media');
        const spinner = page.querySelector('.clip-spinner');
        clearClipTimer(page);
        clearTimeout(page._preloadTimer);
        const v = mediaWrap.querySelector('video');
        if (v) { v.pause(); v.muted = true; v.removeAttribute('src'); v.load(); }
        mediaWrap.querySelectorAll('video,iframe').forEach(el => el.remove());
        mediaWrap.dataset.loaded = '0';
        if (spinner) spinner.classList.remove('show');
        updateClipProgress(page, 0, CLIP_SECONDS);
    }

    function updateClipProgress(page, elapsed, duration) {
        const fill = page.querySelector('.clip-progress-fill');
        const elapsedEl = page.querySelector('.clip-elapsed');
        if (fill) fill.style.width = Math.min(100, (elapsed / duration) * 100) + '%';
        if (elapsedEl) elapsedEl.textContent = fmtClipTime(elapsed);
    }
    function startClipSimTimer(page) {
        let elapsed = 0;
        updateClipProgress(page, 0, CLIP_SECONDS);
        page._clipTimer = setInterval(() => {
            elapsed += 0.25;
            if (elapsed >= CLIP_SECONDS) elapsed = 0;
            updateClipProgress(page, elapsed, CLIP_SECONDS);
        }, 250);
    }
    function clearClipTimer(page) { if (page._clipTimer) { clearInterval(page._clipTimer); page._clipTimer = null; } }

    document.addEventListener('visibilitychange', () => {
        if (document.hidden && activeClipPage) deactivateClipPage(activeClipPage);
        else if (!document.hidden && activeClipPage) activateClipPage(activeClipPage);
    });

    buildFeed();
})();
</script>
</body>
</html>
